name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 프로젝트 기본 구조 생성
        run: |
          mkdir -p temp_project
          cd temp_project
          flutter create --org com.pocket.money myapp
          cd ..
          cp -r temp_project/myapp/android ./
          rm -rf temp_project

      - name: 앱 패키지 설치
        run: flutter pub get

      - name: Android APK 빌드
        run: flutter build apk

      - name: APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: pocket-money-app
          path: build/app/outputs/flutter-apk/app-release.apk
