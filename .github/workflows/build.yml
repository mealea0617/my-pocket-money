name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 깨끗한 안드로이드 프로젝트 뼈대 생성
        run: |
          # 1. 새 플러터 프로젝트를 만들어 순정 안드로이드 폴더 추출
          flutter create --org com.pocket.money --project-name pocket_money_app fresh_app
          cp -r fresh_app/android ./
          rm -rf fresh_app

          # 2. 앱 표시 이름을 '얼마남았지?'로 지정
          sed -i 's/android:label="pocket_money_app"/android:label="얼마남았지?"/g' android/app/src/main/AndroidManifest.xml

      - name: 의존성 설치
        run: flutter pub get

      - name: Android APK 빌드
        run: flutter build apk --release

      - name: APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: HowMuchLeft-App
          path: build/app/outputs/flutter-apk/app-release.apk
